<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crusty</title>
    <script>
      // Dark unless the OS asks for light, set before first paint so there's no flash.
      ;(() => {
        const light = matchMedia('(prefers-color-scheme: light)')
        const apply = () => document.documentElement.classList.toggle('dark', !light.matches)
        apply()
        light.addEventListener('change', apply)
      })()
    </script>
    <meta name="description" content="Crusty HTTP client in the browser, on the same Rust core as the terminal and desktop apps." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
